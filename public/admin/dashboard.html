<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <h1>Leads</h1>
    <a href="/api/admin/logout" class="btn btn-sm btn-danger mb-3">Logout</a>

    <table id="leadsTable" class="table table-bordered table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Status</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>

    <script>
        $(document).ready(function() {
        const table = $('#leadsTable').DataTable({
            dom: 'Bfrtip',   // Show buttons
            buttons: ['csv', 'excel', 'pdf'], // Export options
            order: [[4, 'desc']], // Default sort by Date desc
            columns: [
            { data: 'name' },
            { data: 'phone' },
            { data: 'email' },
            { data: 'status' },
            { data: 'created_at' }
            ]
        });

        // Fetch data from server
        fetch("/api/admin/leads", { credentials: "same-origin" })
            .then(res => {
            if (res.redirected) {
                window.location = res.url;
                return;
            }
            return res.json();
            })
            .then(data => {
            table.clear();
            table.rows.add(data);
            table.draw();
            });

        // Update status via select dropdown
        $('#leadsTable').on('change', 'select', function() {
            const row = $(this).closest('tr');
            const id = table.row(row).data().id;
            const status = $(this).val();
            fetch(`/api/admin/leads/${id}/status`, {
            method: 'POST',
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({status})
            });
        });
        });

        data.forEach(l => {
        l.status = `<select class="form-select form-select-sm">
                        ${["new","contacted","won","lost"].map(s => `<option ${l.status===s?"selected":""}>${s}</option>`).join('')}
                    </select>`;
        });
    </script>
</body>
</html>

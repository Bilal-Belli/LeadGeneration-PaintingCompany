<!DOCTYPE html>
<html>
<head>
  <title>Painting Quote Request</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>

<body class="bg-light">

<div class="container mt-5">
  <h1>Request Painting Service</h1>

  <form id="leadForm" class="mt-4">
    <input class="form-control mb-2" name="name" placeholder="Name" required />
    <input class="form-control mb-2" name="phone" placeholder="Phone" required />
    <input class="form-control mb-2" name="email" placeholder="Email" />
    <input class="form-control mb-2" name="address" placeholder="Address" />

    <textarea class="form-control mb-3" name="message"
      placeholder="Tell us about your project"></textarea>

    <button class="btn btn-primary">Submit</button>
  </form>

  <div id="successMsg" class="alert alert-success mt-3 d-none">
    Request sent!
  </div>
</div>

<script>
document.getElementById("leadForm").addEventListener("submit", async e => {
  e.preventDefault();

  const form = e.target;
  const data = Object.fromEntries(new FormData(form));

  const res = await fetch("/api/leads", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  if (res.ok) {
    document.getElementById("successMsg").classList.remove("d-none");
    form.reset();
  }
});
</script>

</body>
</html>
